<div class="min-h-screen bg-gray-100 p-8">
  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-6">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">{{ title }}</h2>

    <!-- Form Add: Inputs and Add Button in one single responsive row -->
    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 mb-6">
      <h3 class="text-lg font-semibold text-gray-700 mb-3 text-center">Add New Bike</h3>
      <div class="flex flex-col sm:flex-row gap-2 items-center">
        <input
          [(ngModel)]="newBrand"
          placeholder="Brand (e.g. Honda)"
          class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm w-full"
        />
        <input
          [(ngModel)]="newModel"
          placeholder="Model (e.g. ADV)"
          class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm w-full"
        />
        <input
          [(ngModel)]="newPrice"
          type="number"
          placeholder="Price ($)"
          class="w-full sm:w-28 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
        />
        <button
          (click)="addMotorcycle()"
          class="bg-blue-600 text-white px-5 py-2 rounded-md hover:bg-blue-700 transition font-medium text-sm w-full sm:w-auto shrink-0"
        >
          Add
        </button>
      </div>
    </div>

    <!-- Motorcycle list -->
    <h3 class="text-lg font-semibold text-gray-700 mb-3 px-1">Motorcycle List</h3>
    <div class="space-y-3">
      <div
        *ngFor="let bike of motorcycles"
        class="bg-white border border-gray-200 p-4 rounded-lg shadow-sm"
      >
        <!-- Edit Mode  -->
        <div *ngIf="editingId === bike.id" class="flex flex-col sm:flex-row gap-2 items-center">
          <input
            [(ngModel)]="editBrand"
            class="px-3 py-1.5 border border-gray-300 rounded-md text-sm w-full sm:w-1/3"
          />
          <input
            [(ngModel)]="editModel"
            class="px-3 py-1.5 border border-gray-300 rounded-md text-sm w-full sm:w-1/3"
          />
          <input
            [(ngModel)]="editPrice"
            type="number"
            class="px-3 py-1.5 border border-gray-300 rounded-md text-sm w-full sm:w-1/4"
          />
          <div class="flex gap-2 w-full sm:w-auto">
            <button
              (click)="updateMotorcycle()"
              class="bg-green-600 text-white px-3 py-1.5 rounded-md text-sm hover:bg-green-700 transition flex-1 sm:flex-none"
            >
              Save
            </button>
            <button
              (click)="cancelEdit()"
              class="bg-gray-400 text-white px-3 py-1.5 rounded-md text-sm hover:bg-gray-500 transition flex-1 sm:flex-none"
            >
              Cancel
            </button>
          </div>
        </div>

        <!-- Display Mode  -->
        <div *ngIf="editingId !== bike.id" class="flex items-center justify-between">
          <div>
            <p class="font-semibold text-gray-800">{{ bike.brand }} {{ bike.model }}</p>
            <p class="text-sm text-green-600 font-medium">${{ bike.price }}</p>
          </div>
          <!-- Action Buttons: Edit and Delete -->
          <div class="flex gap-2">
            <button
              (click)="startEdit(bike)"
              class="bg-amber-500 text-white px-3 py-1.5 rounded-md text-sm hover:bg-amber-600 transition"
            >
              Edit
            </button>
            <button
              (click)="deleteMotorcycle(bike.id)"
              class="bg-red-500 text-white px-3 py-1.5 rounded-md text-sm hover:bg-red-600 transition"
            >
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
